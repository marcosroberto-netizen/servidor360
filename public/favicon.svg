<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fundo: Esmeralda Escuro Institucional (S360) -->
    <linearGradient id="s360-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Gradiente da Órbita 360°: Esmeralda vibrante a Menta luminosa -->
    <linearGradient id="s360-orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#011913" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo Squircle com borda institucional refinada -->
  <rect width="64" height="64" rx="16" fill="url(#s360-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.2" />

  <g filter="url(#subtle-shadow)">
    <!-- Arco da Órbita 360° (Raio 21 em torno de 32, 32 - Espessura de 3.8px para nitidez perfeita) -->
    <path
      d="M 42 14.5 A 21 21 0 1 1 26.5 11.5"
      fill="none"
      stroke="url(#s360-orbit)"
      stroke-width="3.8"
      stroke-linecap="round"
    />

    <!-- Seta 360° direcional aerodinâmica -->
    <path
      d="M 25 7 L 34 11.5 L 25 16 L 27 11.5 Z"
      fill="#34d399"
      stroke="#34d399"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Silhueta Central do Servidor Público (Prontuário Funcional Digital) -->
    <!-- Cabeça -->
    <circle cx="32" cy="24.5" r="5.5" fill="#FFFFFF" />

    <!-- Corpo / Busto estilizado -->
    <path
      d="M 21 44.5 C 21 37.8 25.8 34.2 32 34.2 C 38.2 34.2 43 37.8 43 44.5 C 43 45.8 42 46.5 40 46.5 L 24 46.5 C 22 46.5 21 45.8 21 44.5 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
